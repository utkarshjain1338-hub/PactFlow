name: CI — Build, Lint, Test

# =============================================================================
# PactFlow GitHub Actions CI Pipeline
# Authority: SYSTEM_ARCHITECTURE.md §13.3 (GitHub Actions CI/CD Pipeline)
#
# Triggers:
#   - Pull Requests to main
#   - Pushes to main
#
# Steps:
#   1. Checkstyle lint (Google Java Style Guide)
#   2. Build (backend + frontend)
#   3. Unit Tests (JUnit)
#   4. Integration Tests (Testcontainers)
#   5. Coverage Gate (≥80% required — PROJECT_CONSTITUTION.md §9)
#   6. Security Scan (OWASP dependency-check)
# =============================================================================

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  JAVA_VERSION: '21'
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true"

jobs:
  # ─── Backend: Lint ──────────────────────────────────────────────────────────
  lint-backend:
    name: "Backend — Checkstyle"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run Checkstyle
        working-directory: backend
        run: ./gradlew checkstyleMain --no-daemon

  # ─── Frontend: Lint ─────────────────────────────────────────────────────────
  lint-frontend:
    name: "Frontend — ESLint + TypeScript"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Run TypeScript check
        working-directory: frontend
        run: npm run type-check || npx tsc --noEmit

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

  # ─── Smart Contract: Build + Test ───────────────────────────────────────────
  test-smart-contract:
    name: "Smart Contract — Build & Test"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Run Cargo Test
        working-directory: contracts
        run: |
          cargo test

      - name: Build Contract
        working-directory: contracts
        run: |
          cargo build
          cargo build --target wasm32v1-none --release

  # ─── Backend: Build + Unit Tests ────────────────────────────────────────────
  test-backend-unit:
    name: "Backend — Unit Tests"
    runs-on: ubuntu-latest
    needs: lint-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run unit tests
        working-directory: backend
        run: ./gradlew test --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test/
          retention-days: 7

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/build/reports/jacoco/
          retention-days: 7
  # ─── Frontend: Build ─────────────────────────────────────────────────────────
  build-frontend:
    name: "Frontend — Next.js Build"
    runs-on: ubuntu-latest
    needs: lint-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build Next.js
        working-directory: frontend
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  # ─── Security Scan ───────────────────────────────────────────────────────────
  security-scan:
    name: "Security — OWASP Dependency Check"
    runs-on: ubuntu-latest
    needs: [ test-backend-unit, build-frontend ]
    # Only run on main branch to avoid rate limiting on PRs
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run OWASP dependency check
        working-directory: backend
        run: ./gradlew dependencyCheckAnalyze --no-daemon
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-report
          path: backend/build/reports/dependency-check-report.html
          retention-days: 30

  # ─── All Checks Summary ──────────────────────────────────────────────────────
  ci-complete:
    name: "CI Complete"
    runs-on: ubuntu-latest
    needs:
      - lint-backend
      - lint-frontend
      - test-backend-unit
      - test-smart-contract
      - build-frontend
    steps:
      - name: CI passed
        run: echo "All CI checks passed. Ready for merge."

  # ─── CD: Mock Deployments ────────────────────────────────────────────────────
  deploy-frontend:
    name: "Frontend — Deploy"
    runs-on: ubuntu-latest
    needs: ci-complete
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy Frontend (Mock)
        working-directory: frontend
        run: |
          echo "Deploying frontend to Vercel..."
          # npx vercel --prod --token ${{ secrets.VERCEL_TOKEN }}

  deploy-smart-contract:
    name: "Smart Contract — Deploy"
    runs-on: ubuntu-latest
    needs: ci-complete
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy Smart Contract (Mock)
        working-directory: contracts
        run: |
          echo "Deploying smart contract to Stellar testnet..."
          # stellar contract deploy --wasm target/wasm32v1-none/release/pactflow_escrow.wasm --source ${{ secrets.STELLAR_SECRET }} --network testnet
