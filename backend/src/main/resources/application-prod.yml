# ─────────────────────────────────────────────────────────────────
# PactFlow Backend — Production Profile
# Activated with: -Dspring.profiles.active=prod
#
# Authority: SYSTEM_ARCHITECTURE.md §13.1 (environment strategy)
# SECURITY_THREAT_MODEL.md §14 (secrets management)
# ─────────────────────────────────────────────────────────────────

spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

# ─── OpenAPI disabled in production ─────────────────────────────
# SECURITY_THREAT_MODEL.md: never expose API docs in production
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# ─── Production logging — structured JSON only ──────────────────
# SYSTEM_ARCHITECTURE.md §12.2: machine-parseable JSON format
logging:
  level:
    root: WARN
    com.pactflow: INFO
    org.springframework.security: WARN
    org.hibernate: ERROR
    org.flywaydb: INFO

# ─── Actuator — restricted in production ────────────────────────
management:
  endpoint:
    health:
      show-details: never
      show-components: never
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

pactflow:
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}