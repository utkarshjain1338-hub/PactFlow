# ─────────────────────────────────────────────────────────────────
# PactFlow Backend — Base Application Configuration
# Profile: default (overridden by -dev, -prod, -staging)
#
# Authority: SYSTEM_ARCHITECTURE.md §5.1, §7.3, §12.3, §13.4
# ─────────────────────────────────────────────────────────────────

spring:
  application:
    name: pactflow-api

  # ─── Virtual Threads (Java 21) ─────────────────────────────────
  # SYSTEM_ARCHITECTURE.md §5.1: "Virtual Threads for I/O efficiency"
  threads:
    virtual:
      enabled: true

  # ─── Data Source (overridden per profile) ──────────────────────
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pactflow}
    username: ${DB_USERNAME:pactflow_app}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
    hikari:
      # SYSTEM_ARCHITECTURE.md §7.3: HikariCP pool configuration
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      pool-name: PactFlow-HikariCP
      auto-commit: false

  # ─── JPA / Hibernate ───────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
          batch_size: 25
        order_inserts: true
        order_updates: true
        format_sql: false
        default_schema: public

  # ─── Flyway ────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    out-of-order: false
    schemas: public
    table: flyway_schema_history

  # ─── Redis ─────────────────────────────────────────────────────
  # SYSTEM_ARCHITECTURE.md §7.6: Redis cache layers
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 3s
      timeout: 3s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: 3s

  # ─── Mail ──────────────────────────────────────────────────────
  mail:
    host: ${EMAIL_SMTP_HOST:localhost}
    port: ${EMAIL_SMTP_PORT:1025}
    username: ${EMAIL_SMTP_USERNAME:}
    password: ${EMAIL_SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  # ─── Jackson / JSON ────────────────────────────────────────────
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      write-date-timestamps-as-nanoseconds: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
      adjust-dates-to-context-time-zone: false
    mapper:
      default-view-inclusion: false
    time-zone: UTC
    date-format: "yyyy-MM-dd'T'HH:mm:ss'Z'"

# ─── Server Configuration ──────────────────────────────────────────
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024
  http2:
    enabled: true
  forward-headers-strategy: framework
  error:
    # Disable Spring Boot's default /error endpoint — we use GlobalExceptionHandler
    whitelabel:
      enabled: false
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

# ─── Spring Actuator Health Probes ────────────────────────────────
# SYSTEM_ARCHITECTURE.md §12.3, §12.7
management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis
    info:
      enabled: true
    metrics:
      enabled: true
    prometheus:
      enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    redis:
      enabled: true
    db:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${ENVIRONMENT:local}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
  info:
    env:
      enabled: true
    git:
      enabled: true
    build:
      enabled: true

# ─── Application Info ─────────────────────────────────────────────
info:
  app:
    name: PactFlow API
    version: '@project.version@'
    description: Milestone-based freelance escrow platform

# ─── Springdoc OpenAPI ────────────────────────────────────────────
# Authority: PROJECT_CONSTITUTION.md §12, SYSTEM_ARCHITECTURE.md §5.1
springdoc:
  api-docs:
    path: /api-docs
    enabled: ${OPENAPI_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${OPENAPI_ENABLED:true}
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
    filter: true
  packages-to-scan: com.pactflow.infrastructure.web.controller
  default-produces-media-type: application/json

# ─── Logging ──────────────────────────────────────────────────────
# SYSTEM_ARCHITECTURE.md §12.2: Structured JSON logging with trace IDs
logging:
  pattern:
    # Production: structured JSON (overridden in dev for console readability)
    console: '{"timestamp":"%d{yyyy-MM-dd HH:mm:ss.SSS}","level":"%p","service":"pactflow-api","traceId":"%X{traceId:-}","spanId":"%X{spanId:-}","requestId":"%X{requestId:-}","userId":"%X{userId:-}","logger":"%logger{36}","message":"%msg"}%n'
  level:
    root: INFO
    com.pactflow: INFO
    org.springframework.security: WARN
    org.hibernate: WARN
    org.flywaydb: INFO

# ─── Stellar / Soroban Configuration ─────────────────────────────
# SYSTEM_ARCHITECTURE.md §13.4
pactflow:
  stellar:
    network: ${STELLAR_NETWORK:testnet}
    network-passphrase: ${STELLAR_NETWORK_PASSPHRASE:Test SDF Network ; September 2015}
    horizon-url: ${HORIZON_URL:https://horizon-testnet.stellar.org}
    soroban-rpc-url: ${SOROBAN_RPC_URL:https://soroban-testnet.stellar.org}
    contract-id: ${PACTFLOW_CONTRACT_ID:CB5SH4Q4USZWMYCNXIX2IBBUCTS3HNO5GE4IJI6FKYJ25Q3HVYRUGNXL}
    xlm-token-id: ${XLM_TOKEN_ID:CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC}
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY:dev-only-change-in-production-must-be-256-bits-minimum}
      access-token-ttl: PT15M
      refresh-token-ttl: P30D
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    rate-limit:
      global-unauthenticated-rpm: 60
      global-authenticated-rpm: 300
      auth-endpoints-rpm: 10
      forgot-password-rph: 3
      wallet-challenge-rpm: 5
      mutation-endpoints-rpm: 60
  admin:
    wallet-address: ${PACTFLOW_ADMIN_ADDRESS:}
  mail:
    from-address: ${EMAIL_FROM_ADDRESS:noreply@pactflow.io}
  ingestion:
    poll-interval-seconds: 3
    max-retry-attempts: 5

# ─── Stellar / Soroban Configuration ──────────────────────────────
stellar:
  network: ${STELLAR_NETWORK:testnet}
  rpc-url: ${STELLAR_RPC_URL:https://soroban-testnet.stellar.org}
  network-passphrase: ${STELLAR_NETWORK_PASSPHRASE:Test SDF Network ; September 2015}
  contract-id: ${STELLAR_CONTRACT_ID:}
  operator-address: ${STELLAR_OPERATOR_ADDRESS:}
