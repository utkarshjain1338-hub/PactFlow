# ─────────────────────────────────────────────────────────────────
# PactFlow Backend — Development Profile
# Activated with: -Dspring.profiles.active=dev
#
# Authority: SYSTEM_ARCHITECTURE.md §13.1 (environment strategy)
# ─────────────────────────────────────────────────────────────────

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/pactflow_dev
    username: pactflow_app
    password: pactflow_dev_secret

  data:
    redis:
      url: redis://localhost:6379
      password: ""

  mail:
    host: localhost
    port: 1025

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false

# ─── OpenAPI enabled in dev ─────────────────────────────────────
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# ─── Development logging — human-readable console ───────────────
logging:
  pattern:
    console: '%clr(%d{HH:mm:ss.SSS}){faint} %clr(%5p) %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx'
  level:
    root: INFO
    com.pactflow: DEBUG
    org.springframework.security: DEBUG
    org.hibernate: WARN

pactflow:
  security:
    cors:
      allowed-origins: http://localhost:3000,http://localhost:3001
    jwt:
      secret-key: dev-only-key-do-not-use-in-production-256bit-minimum-length-required

management:
  server:
    port: 8081
  endpoint:
    health:
      show-details: always
      show-components: always
