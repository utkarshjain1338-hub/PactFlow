# Integration test profile — overrides for Testcontainers
# DataSource and Redis configured dynamically via @DynamicPropertySource in AbstractIntegrationTest

spring:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    validate-on-migrate: true

  jackson:
    default-property-inclusion: non_null

management:
  server:
    port: 0

pactflow:
  security:
    jwt:
      secret-key: integration-test-secret-key-256bits-minimum-length-required
    cors:
      allowed-origins: http://localhost:3000
  stellar:
    network: testnet
    horizon-url: "https://horizon-testnet.stellar.org"
    soroban-rpc-url: "https://soroban-testnet.stellar.org"
  admin:
    wallet-address: ""

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: WARN
    com.pactflow: INFO
    org.flywaydb: INFO
