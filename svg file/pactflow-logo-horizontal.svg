<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320">
  <defs>
    <linearGradient id="badgeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#211C57"/>
      <stop offset="100%" stop-color="#0B1023"/>
    </linearGradient>
    <radialGradient id="sheen" cx="28%" cy="22%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leftArcGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="rightArcGrad" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="stemGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="topNodeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <clipPath id="badgeClip">
      <rect x="20" y="20" width="280" height="280" rx="64" ry="64"/>
    </clipPath>
  </defs>

  <!-- Badge -->
  <rect x="20" y="20" width="280" height="280" rx="64" ry="64" fill="url(#badgeGrad)"/>
  <rect x="20" y="20" width="280" height="280" rx="64" ry="64" fill="url(#sheen)" clip-path="url(#badgeClip)"/>

  <!-- Mark: two parties converging into a pact, flowing up through milestones to a completed payout -->
  <g fill="none" stroke-linecap="round">
    <path d="M90,214 C112,172 132,152 160,150" stroke="url(#leftArcGrad)" stroke-width="11"/>
    <path d="M230,214 C208,172 188,152 160,150" stroke="url(#rightArcGrad)" stroke-width="11"/>
    <path d="M160,150 C160,128 160,104 160,86" stroke="url(#stemGrad)" stroke-width="11"/>
  </g>

  <circle cx="90" cy="214" r="7" fill="url(#leftArcGrad)"/>
  <circle cx="230" cy="214" r="7" fill="url(#rightArcGrad)"/>
  <circle cx="160" cy="150" r="9" fill="#EDE9FE" stroke="url(#stemGrad)" stroke-width="4"/>
  <circle cx="160" cy="118" r="5" fill="#5EEAD4"/>

  <circle cx="160" cy="78" r="16" fill="url(#topNodeGrad)"/>
  <path d="M152,78 L158,84 L169,71" fill="none" stroke="#3B2A05" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wordmark -->
  <text x="338" y="196" font-family="'Poppins','Segoe UI',system-ui,-apple-system,sans-serif" font-size="94" letter-spacing="-1.5">
    <tspan font-weight="700" fill="#1E1B4B">Pact</tspan><tspan font-weight="500" fill="#0D9488">Flow</tspan>
  </text>
  <text x="340" y="234" font-family="'Poppins','Segoe UI',system-ui,-apple-system,sans-serif" font-size="21" letter-spacing="2" fill="#64748B">ESCROW, ON&#8209;CHAIN</text>
</svg>
